# Metabase on Postgres, with a separate read-only role for BI.
#   cp .env.example .env && docker compose up -d && python setup/metabase_setup.py
services:
  warehouse:                       # the database you want to chart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${WAREHOUSE_OWNER_PASSWORD}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD}
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "owner", "-d", "warehouse"]
      interval: 5s
      retries: 30
    ports: ["127.0.0.1:5433:5432"]

  metabase-db:                     # Metabase's own application database (never the H2 default in production)
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
    volumes: [metabase-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "metabase", "-d", "metabase"]
      interval: 5s
      retries: 30

  metabase:
    image: metabase/metabase:v0.58.34
    depends_on:
      metabase-db: {condition: service_healthy}
      warehouse: {condition: service_healthy}
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_ENABLE_PUBLIC_SHARING: "true"
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_OPTS: -Xmx1g
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      retries: 60

volumes:
  warehouse-data:
  metabase-db-data:
